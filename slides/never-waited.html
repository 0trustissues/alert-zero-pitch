<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>What if it never waited?</title>
<link rel="stylesheet" href="style/eweb.css">
<style>
  h1{font-size:56px;letter-spacing:-2.2px}
  .sub{font-size:19px;margin-top:10px}

  .n{position:absolute;top:214px;font:600 156px/1 var(--sans);letter-spacing:-7px;white-space:nowrap;z-index:2}
  #a{left:66px;color:var(--blue)}
  #b{left:948px;color:var(--pink);transform-origin:50% 60%;animation:one .55s cubic-bezier(.2,1.5,.4,1) 1.25s both}
  @keyframes one{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
  .cp{position:absolute;top:396px;font-size:18px;line-height:1.35;color:var(--char);z-index:2}
  #ca{left:72px;width:500px} #cb{left:952px}

  #ar{position:absolute;left:610px;top:250px;width:300px;height:80px;z-index:1;overflow:visible}
  #sh{transform-origin:0 50%;animation:shaft .6s cubic-bezier(.2,.8,.2,1) .8s both}
  #hd{animation:head .3s ease 1.3s both;transform-origin:230px 40px}
  @keyframes shaft{from{transform:scaleX(0)}to{transform:none}}
  @keyframes head{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
  #cv{position:absolute;left:600px;top:190px;width:340px;height:200px;z-index:2;pointer-events:none}

  /* a ring that spreads from the one decision when it lands */
  #ring{position:absolute;left:1000px;top:290px;width:20px;height:20px;margin:-10px;border:2px solid var(--pink);border-radius:50%;opacity:0;z-index:1;animation:ring 1.1s ease-out 1.5s both}
  @keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(9)}}

  .bn{position:absolute;left:72px;right:80px;top:520px;height:92px;background:#fff;border:1.5px solid var(--ink);box-shadow:8px 8px 0 var(--blue);display:flex;align-items:center;justify-content:center;font:600 28px var(--sans);letter-spacing:-.9px;color:var(--ink);z-index:2;opacity:0;animation:rise .6s cubic-bezier(.2,.9,.25,1.05) 1.1s both}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
</style>
</head>
<body data-foot="Nightshift · It never waited">
<div class="z">
  <div class="eyebrow in1">Nightshift · <b>Overnight</b></div>
  <h1 class="in2">What if it <span class="b">never waited?</span></h1>
  <p class="sub in3">Not just alerts: hunts, rule proposals, investigations, actions</p>
</div>

<div class="n" id="a">0</div>
<div class="cp in4" id="ca">Items overnight: alerts, hunts, rule proposals, investigations, actions</div>

<svg id="ar" viewBox="0 0 300 80">
  <rect id="sh" x="0" y="28" width="236" height="24" fill="#DDE3EC"/>
  <polygon id="hd" points="230,4 300,40 230,76" fill="#0B64DD"/>
</svg>
<canvas id="cv" width="680" height="400"></canvas>

<div id="ring"></div>
<div class="n" id="b">1</div>
<div class="cp in5" id="cb">Needs a decision</div>

<div class="bn">Closed with a reason, or folded into one decision, before anyone arrived</div>

<script src="style/eweb.js"></script>
<script src="/js/fuckslides.js"></script>
<script>
(function(){
  const still = navigator.webdriver;
  const a = document.getElementById('a');
  const ease = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
  const t0 = performance.now();

  // 1,859 counts up
  const show = k => { a.textContent = Math.round(1859 * k).toLocaleString('en-US'); };
  if (still) show(1); else { const f = now => { const k = ease(((now - t0) / 1000 - .3) / 1.0); show(k); if (k < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); }

  // the stream: mixed raw items enter wide, narrow to one lane, turn uniform blue, and land as a single decision
  const cv = document.getElementById('cv'), c = cv.getContext('2d'); c.scale(2, 2);
  const W = 340, H = 200, CY = 100, X0 = 4, X1 = 328;
  const RAW = ['#0B64DD', '#F04E98', '#02BCB7', '#FF7E62', '#FEC514'];
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const B = hex('#0B64DD');
  const N = 46, P = [];
  for (let i = 0; i < N; i++) P.push({ph: i / N, sp: .85 + Math.random() * .3, y: (Math.random() * 2 - 1) * 78, col: hex(RAW[i % RAW.length])});
  const START = 1.0;
  function draw(now){
    const t = (now - t0) / 1000;
    c.clearRect(0, 0, W, H);
    if (t > START){
      const ramp = Math.min(1, (t - START) / .6);
      P.forEach(p => {
        const u = ((t - START) * .38 * p.sp + p.ph) % 1;          // 0 at the left, 1 at the decision
        const x = X0 + (X1 - X0) * u * u * (3 - 2 * u) * .5 + (X1 - X0) * u * .5;
        const y = CY + p.y * Math.pow(1 - u, 1.6);
        const m = Math.min(1, u * 1.6);                            // mixed colours settle to blue
        const col = p.col.map((v, i) => Math.round(v + (B[i] - v) * m));
        const s = 7 - 3.5 * u, al = ramp * Math.min(1, u * 8, (1 - u) * 6);
        c.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${al})`;
        c.fillRect(x - s / 2, y - s / 2, s, s);
      });
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
<script>EW.dots({x: 1060, y: 16, w: 190, h: 140, gap: 9, r: .9, seed: 66, blobs: 2, thr: .45});</script>
</body>
</html>
