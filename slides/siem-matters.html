<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The SIEM has never mattered more</title>
<link rel="stylesheet" href="style/eweb.css">
<style>
  h1{font-size:44px;letter-spacing:-1.6px}
  .sub{font-size:19px;margin-top:8px}

  .st{position:absolute;left:72px;top:176px;width:1136px;height:420px;z-index:2}
  .st > *{position:absolute}
  svg.ln{left:0;top:0;width:1136px;height:420px;z-index:1;overflow:visible}
  .cap{font:500 10px var(--mono);letter-spacing:.16em;color:var(--grey);text-transform:uppercase;top:0}

  .sg{left:0;width:230px;height:40px;z-index:2;display:flex;align-items:center;gap:10px;padding:0 12px;background:#fff;border:1px solid var(--line);font:500 13.5px var(--sans);color:var(--ink);white-space:nowrap;opacity:0;animation:inL .5s cubic-bezier(.2,.8,.2,1) both}
  .sg i{width:8px;height:8px;border-radius:50%;flex:none}
  @keyframes inL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}

  .hub{left:450px;top:62px;width:256px;height:330px;z-index:2;background:var(--blue);box-shadow:8px 8px 0 var(--blue-d);color:#fff;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 18px;animation:hub .7s cubic-bezier(.2,.9,.25,1.1) .3s both}
  .hub .k{font:500 9.5px var(--mono);letter-spacing:.24em;color:#9DC1F5}
  .hub h2{font:600 44px/1 var(--sans);letter-spacing:-2px;margin-top:14px}
  .hub p{margin-top:12px;font-size:16.5px;line-height:1.3}
  .hub .m{margin-top:22px;font:500 9px var(--mono);letter-spacing:.14em;color:#9DC1F5}
  @keyframes hub{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}

  .ag{left:906px;width:230px;height:84px;z-index:2;background:#fff;border:1.5px solid var(--blue);padding:11px 14px;opacity:0;animation:inR .5s cubic-bezier(.2,.8,.2,1) both}
  .ag .t{display:flex;align-items:center;gap:7px;font:600 9px var(--mono);letter-spacing:.16em;color:var(--blue)}
  .ag .t i{width:8px;height:8px;border-radius:50%;background:var(--blue)}
  .ag p{margin-top:6px;font:600 15px/1.22 var(--sans);letter-spacing:-.3px;color:var(--ink)}
  @keyframes inR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}

  .tag2{position:absolute;left:0;right:0;top:612px;text-align:center;font:600 26px var(--sans);letter-spacing:-.8px;color:var(--ink);z-index:2}
</style>
</head>
<body data-foot="Platform · The SIEM">
<div class="z">
  <div class="eyebrow in1">Platform · <b>The SIEM</b></div>
  <h1 class="in2">The SIEM has never <span class="b">mattered more.</span></h1>
  <p class="sub in3">The control plane for the age of automation</p>
</div>

<div class="st" id="st">
  <div class="cap in3" style="left:0">Every signal type</div>
  <div class="cap in3" style="left:906px">Agents ask</div>
  <svg class="ln" id="ln" viewBox="0 0 1136 420"></svg>
  <div class="hub">
    <div class="k">ELASTICSEARCH</div>
    <h2>The SIEM</h2>
    <p>All your data, one place, at retention.</p>
    <div class="m">EVERY SIGNAL · YEARS BACK · ES|QL</div>
  </div>
</div>
<div class="tag2 in6">All your data, one place, <span class="b">where agents work.</span></div>

<script src="style/eweb.js"></script>
<script src="/js/fuckslides.js"></script>
<script>
(function(){
  const st = document.getElementById('st'), ln = document.getElementById('ln');
  const NS = 'http://www.w3.org/2000/svg';
  const sig = [['Human and machine identities', '#0B64DD'], ['Endpoints', '#F04E98'], ['Cloud audit', '#02BCB7'], ['Network', '#0B64DD'], ['SaaS and email', '#F04E98'], ['Containers and workloads', '#02BCB7'], ['Code and CI', '#0B64DD'], ['Threat intelligence', '#F04E98']];
  const ask = ['Who is operating here, human and non-human?', 'What is moving laterally through the network?', 'Which devices did swarms of agents compromise?'];
  const still = navigator.webdriver;

  const mk = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); ln.appendChild(e); return e; };
  // a line that draws itself, then carries a signal along it for good
  function wire(id, d, drawAt, color, dotAt, dur, first){
    const p = mk('path', {id, d, fill: 'none', stroke: color, 'stroke-width': 1.6, 'stroke-opacity': .55, pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': still ? 0 : 1});
    if (!still) p.style.animation = `draw .6s ease ${drawAt}s forwards`;
    const c = mk('circle', {cx: -20, cy: -20, r: 5, fill: '#0B64DD', opacity: 0});
    dots.push({p, c, len: p.getTotalLength(), at: dotAt, dur});
  }
  const dots = [];
  const tick = now => {
    const t = (now - T0) / 1000;
    dots.forEach(d => {
      if (t < d.at) return;
      const u = ((t - d.at) % (d.dur + .6)) / d.dur;      // a short rest between runs
      if (u > 1){ d.c.setAttribute('opacity', 0); return; }
      const pt = d.p.getPointAtLength(d.len * u);
      d.c.setAttribute('cx', pt.x); d.c.setAttribute('cy', pt.y);
      d.c.setAttribute('opacity', Math.min(1, u * 8, (1 - u) * 8));
    });
    requestAnimationFrame(tick);
  };
  const T0 = performance.now();
  requestAnimationFrame(tick);

  // signals in
  sig.forEach(([name, col], i) => {
    const y = 26 + i * 50, ty = 92 + i * 36, d = .35 + i * .07;
    const el = document.createElement('div'); el.className = 'sg'; el.style.top = y + 'px'; el.style.animationDelay = d + 's';
    el.innerHTML = `<i style="background:${col}"></i>${name}`; st.appendChild(el);
    wire('wi' + i, `M230 ${y + 20} C 340 ${y + 20}, 340 ${ty}, 450 ${ty}`, d + .25, '#0B64DD', 1.3 + i * .3, 2.2, [230, y + 20]);
  });
  // answers out
  ask.forEach((q, i) => {
    const y = [40, 175, 310][i], sy = [130, 227, 324][i], ty = y + 42, d = .9 + i * .1;
    const el = document.createElement('div'); el.className = 'ag'; el.style.top = y + 'px'; el.style.animationDelay = d + 's';
    el.innerHTML = `<div class="t"><i></i>AGENT</div><p>${q}</p>`; st.appendChild(el);
    wire('wo' + i, `M706 ${sy} C 800 ${sy}, 812 ${ty}, 906 ${ty}`, .85 + i * .08, '#0B64DD', 1.8 + i * .55, 1.8, [706, sy]);
  });
  const s = document.createElement('style'); s.textContent = '@keyframes draw{to{stroke-dashoffset:0}}'; document.head.appendChild(s);
})();
</script>
<script>EW.dots({x: 1060, y: 16, w: 190, h: 140, gap: 9, r: .9, seed: 59, blobs: 2, thr: .45});</script>
</body>
</html>
